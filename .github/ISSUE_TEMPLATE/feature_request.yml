name: Feature request · 功能建议
description: Suggest a focused improvement · 提议一个明确的改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposal · 问题与建议
      description: What problem would this solve, and what would you like to change?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and alternatives · 范围与替代方案
      description: Include constraints, alternatives, and learning value if relevant.
    validations:
      required: true
