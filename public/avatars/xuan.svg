<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="玄 · 化">
  <defs>
    <radialGradient id="xuan-bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#7eaa8a"/>
      <stop offset="55%" stop-color="#3a5646"/>
      <stop offset="100%" stop-color="#0e1a14"/>
    </radialGradient>
    <radialGradient id="xuan-warm" cx="50%" cy="34%" r="50%">
      <stop offset="0%" stop-color="#e8f0d8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e8f0d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xuan-face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4e4c4"/>
      <stop offset="55%" stop-color="#dec8a0"/>
      <stop offset="100%" stop-color="#a08868"/>
    </linearGradient>
    <linearGradient id="xuan-robe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a7a64"/>
      <stop offset="100%" stop-color="#1c2c20"/>
    </linearGradient>
    <linearGradient id="xuan-sleeve" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6a8a74"/>
      <stop offset="100%" stop-color="#243a2c"/>
    </linearGradient>
  </defs>

  <!-- 松烟绿底 + 仙光 -->
  <rect width="160" height="160" fill="url(#xuan-bg)"/>
  <rect width="160" height="160" fill="url(#xuan-warm)"/>
  <!-- 远山 -->
  <path d="M0 124 L20 110 L34 118 L52 100 L70 116 L88 102 L106 120 L122 108 L140 118 L160 110 L160 130 L0 130 Z" fill="#1c2c20" opacity="0.4"/>

  <!-- 大袖（先画） -->
  <path d="M-2 158 C8 124 26 112 50 116 C58 122 70 130 80 130 C90 130 102 122 110 116 C134 112 152 124 162 158 Z" fill="url(#xuan-sleeve)"/>
  <!-- 宽袖飘边 -->
  <path d="M-2 158 C12 152 28 148 50 146" stroke="#1c2c20" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M162 158 C148 152 132 148 110 146" stroke="#1c2c20" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- 衣（宽袍大袖，厚重） -->
  <path d="M22 158 C30 124 50 114 80 114 C110 114 130 124 138 158 Z" fill="url(#xuan-robe)"/>
  <!-- 交领（V 形宽领） -->
  <path d="M56 118 L80 140 L104 118" fill="none" stroke="#1c2c20" stroke-width="2"/>
  <path d="M60 120 L80 138 L100 120" fill="#3a5646" opacity="0.7"/>
  <path d="M64 122 L80 134 L96 122" fill="#e8e0c8" opacity="0.6"/>
  <!-- 衣纹 -->
  <path d="M28 150 Q60 142 80 144" stroke="#1c2c20" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M80 144 Q108 142 132 150" stroke="#1c2c20" stroke-width="1" fill="none" opacity="0.7"/>
  <path d="M40 156 Q60 150 80 152" stroke="#1c2c20" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- 颈：宽厚 -->
  <path d="M68 100 L68 118 Q80 124 92 118 L92 100 Z" fill="#d8c098"/>
  <path d="M68 112 Q80 116 92 112" stroke="#5a4a30" stroke-width="0.8" fill="none" opacity="0.5"/>

  <!-- 脸：方脸阔额、庙堂气 -->
  <path d="M48 64
    C50 46 64 36 80 36
    C96 36 110 46 112 64
    C112 88 108 106 100 116
    C90 122 70 122 60 116
    C52 106 48 88 48 64Z" fill="url(#xuan-face)"/>
  <!-- 提亮：额、颧 -->
  <ellipse cx="80" cy="48" rx="20" ry="6" fill="#f8e8c8" opacity="0.45"/>
  <ellipse cx="64" cy="78" rx="6" ry="4" fill="#f4dcc0" opacity="0.45"/>
  <ellipse cx="96" cy="78" rx="6" ry="4" fill="#f4dcc0" opacity="0.45"/>
  <!-- 下颌方阔 -->
  <path d="M56 100 C64 118 80 124 92 120 C100 116 104 110 104 100" stroke="#a08868" stroke-width="0.8" fill="none" opacity="0.6"/>
  <!-- 鼻：长直、鼻梁挺 -->
  <path d="M78 70 L76 98 Q78 102 80 102 Q82 102 84 98 L82 70" stroke="#7a6048" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M76 98 Q78 102 80 102" stroke="#7a6048" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M84 98 Q82 102 80 102" stroke="#7a6048" stroke-width="1" fill="none" stroke-linecap="round"/>
  <!-- 鼻翼 -->
  <path d="M76 96 Q77 99 78 99" stroke="#7a6048" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <path d="M84 96 Q83 99 82 99" stroke="#7a6048" stroke-width="0.8" fill="none" stroke-linecap="round"/>

  <!-- 眉：长、灰白、寿眉上扬（仙风相） -->
  <path d="M52 60 C62 54 76 56 80 60" stroke="#5a5040" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M80 60 C84 56 98 54 108 60" stroke="#5a5040" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- 寿眉尾上翘 -->
  <path d="M52 60 C48 58 46 56 46 54" stroke="#5a5040" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M108 60 C112 58 114 56 114 54" stroke="#5a5040" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- 眼：杏眼、慈眉善目 -->
  <path d="M58 72 C66 68 78 68 80 72" stroke="#1a1a1a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M80 72 C82 68 94 68 102 72" stroke="#1a1a1a" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <circle cx="68" cy="72" r="2" fill="#1a1a1a"/>
  <circle cx="92" cy="72" r="2" fill="#1a1a1a"/>
  <circle cx="69" cy="71" r="0.7" fill="#fff" opacity="0.9"/>
  <circle cx="93" cy="71" r="0.7" fill="#fff" opacity="0.9"/>
  <!-- 眼尾纹 -->
  <path d="M58 76 Q66 78 74 76" stroke="#a08868" stroke-width="0.6" fill="none" opacity="0.6"/>
  <path d="M86 76 Q94 78 102 76" stroke="#a08868" stroke-width="0.6" fill="none" opacity="0.6"/>

  <!-- 唇：宽厚平和、微微带笑 -->
  <path d="M70 100 Q80 104 90 100" stroke="#5a3a20" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <path d="M72 102 Q80 104 88 102" stroke="#5a3a20" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- 嘴角上扬 -->
  <path d="M70 100 Q66 100 66 98" stroke="#5a3a20" stroke-width="0.8" fill="none" stroke-linecap="round"/>
  <path d="M90 100 Q94 100 94 98" stroke="#5a3a20" stroke-width="0.8" fill="none" stroke-linecap="round"/>

  <!-- 长髯垂胸（仙风相） -->
  <path d="M70 110 Q72 124 76 138 Q78 144 80 144 Q82 144 84 138 Q88 124 90 110" stroke="#cfc0a8" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M72 116 Q74 128 78 140" stroke="#8a7a60" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M88 116 Q86 128 82 140" stroke="#8a7a60" stroke-width="0.8" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M76 120 Q78 132 80 140" stroke="#8a7a60" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <path d="M84 120 Q82 132 80 140" stroke="#8a7a60" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- 腮须过渡 -->
  <path d="M60 102 Q64 108 70 112" stroke="#cfc0a8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.8"/>
  <path d="M100 102 Q96 108 90 112" stroke="#cfc0a8" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.8"/>

  <!-- 发：束发高髻 -->
  <ellipse cx="80" cy="32" rx="14" ry="10" fill="#1a1a1a"/>
  <path d="M68 36 Q80 26 92 36 Q90 44 80 46 Q70 44 68 36Z" fill="#1a1a1a"/>
  <!-- 髻基带 -->
  <path d="M68 36 Q80 44 92 36" stroke="#3a3024" stroke-width="1.2" fill="none" opacity="0.7"/>
  <!-- 玉簪横插（金色 + 白玉） -->
  <rect x="62" y="30" width="36" height="3.5" rx="1" fill="#c4a35a"/>
  <circle cx="60" cy="31.5" r="2.6" fill="#f4e8c8"/>
  <circle cx="60" cy="31.5" r="1.4" fill="#a89048"/>
  <!-- 髻顶光泽 -->
  <ellipse cx="76" cy="30" rx="4" ry="1.5" fill="#3a3a3a" opacity="0.7"/>
  <!-- 前额发际 -->
  <path d="M56 60 C58 50 68 44 80 44 C92 44 102 50 104 60" stroke="#1a1a1a" stroke-width="1" fill="none" opacity="0.7"/>
  <!-- 鬓角白发 -->
  <path d="M52 62 C50 76 52 88 56 98" stroke="#cfc0a8" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M108 62 C110 76 108 88 104 98" stroke="#cfc0a8" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- 印：化（绿章） -->
  <rect x="118" y="118" width="26" height="26" rx="2" fill="#3a5646"/>
  <rect x="118" y="118" width="26" height="26" rx="2" fill="none" stroke="#16241c" stroke-width="1"/>
  <text x="131" y="137" text-anchor="middle" fill="#f5efe6" font-size="15" font-family="serif" font-weight="600">化</text>
</svg>
